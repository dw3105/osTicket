name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: apcu, gd, imap, intl, mbstring, mysqli, xml, zip
          coverage: none
      - name: osTicket test suite
        run: php setup/test/run-tests.php
